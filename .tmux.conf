# >>> Terminal >>>
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB:usstyle"
set-environment -g COLORTERM truecolor
# <<< Terminal <<<

# >>> Prefix >>>
set -g prefix C-Space
bind C-Space send-prefix
# <<< Prefix <<<

# >>> Mouse Support >>>
set -g mouse on
# <<< Mouse Support <<<

# >>> Claude >>>
set -g focus-events on
# <<< Claude <<<

# >>> Vim Motions >>>
setw -g mode-keys vi

set-option -g set-clipboard on
bind-key -T copy-mode-vi 'v' send -X begin-selection
# pbcopy is macOS-only. On Linux, copying to the Mac clipboard rides on OSC 52
# (set-clipboard on, above) instead, which needs a terminal emulator that
# accepts it -- Terminal.app does not.
if-shell "command -v pbcopy" \
    "bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel pbcopy; bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel pbcopy" \
    "bind-key -T copy-mode-vi y send -X copy-selection-and-cancel; bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel"

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

bind -r H swap-pane -t '{left-of}'
bind -r J swap-pane -t '{down-of}'
bind -r K swap-pane -t '{up-of}'
bind -r L swap-pane -t '{right-of}'
# <<< Vim Motions <<<

# >>> Window Splitting >>>
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
# <<< Window Splitting <<<

# >>> Window Sizing >>>
set -g window-size largest
# <<< Window Sizing <<<

# >>> Window Status Styling >>>
set -g window-status-current-format " #I:#W#{?@agent_state, #{@agent_state},} "
set -g window-status-current-style bold
set -g window-status-activity-style default
set -g window-status-bell-style default
set -g window-status-format "#{?window_last_flag,#[italics],}#[nobold] #I:#W#{?@agent_state, #{@agent_state},} #[default]"
# <<< Window Status Styling <<<

# >>> Escape Latency >>>
# Default is 500ms: tmux waits that long after ESC to see if it begins an
# escape sequence. Over a low-RTT link the sequence bytes arrive together,
# so a short wait is safe and makes ESC feel instant in vim/Claude.
set -sg escape-time 10
# <<< Escape Latency <<<

# >>> Plugins >>>
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Restore layout and cwds only. claude/codex panes come back as plain shells;
# resume them with `claude --resume` / `codex resume` so no stale process is
# launched into a directory it wasn't running in.
set -g @resurrect-processes 'htop'

# Keep this line at the very bottom of tmux.conf
run '~/.tmux/plugins/tpm/tpm'
# <<< Plugins <<<
